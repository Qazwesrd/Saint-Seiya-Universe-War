name: Godot Android Prototype Checks

on:
  push:
    paths:
      - "game/**"
      - "tools/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    paths:
      - "game/**"
      - "tools/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

concurrency:
  group: godot-android-checks-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  project-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate art delivery manifests
        run: python3 tools/art_pipeline/build_manifests.py
      - name: Validate authored art assets
        run: python3 tools/art_pipeline/validate_authored_assets.py
      - name: Audit complete playable-unit and enemy roster
        run: python3 tools/art_pipeline/audit_unit_roster.py
      - name: Test art asset validation rules
        run: python3 -m unittest discover -s tools/art_pipeline -p "test_*.py" -v
      - name: Check art and chapter packaging Python syntax
        run: python3 -m py_compile tools/art_pipeline/blender/generate_base_rig.py tools/art_pipeline/build_chapter_manifests.py tools/art_pipeline/prompt_engine.py tools/art_pipeline/inventory_angelica_client.py tools/art_pipeline/inventory_angelica_pck.py tools/art_pipeline/export_angelica_ski_json.py tools/art_pipeline/export_angelica_rig_json.py tools/art_pipeline/export_angelica_ecm_json.py tools/art_pipeline/validate_angelica_ecm_json.py tools/art_pipeline/angelica_ecm.py tools/art_pipeline/validate_angelica_rig_json.py tools/art_pipeline/angelica_animation.py tools/art_pipeline/blender/import_angelica_ski_json.py tools/art_pipeline/blender/import_angelica_rigged_character.py tools/art_pipeline/blender/import_angelica_stck_animation.py
      - name: Test offline prompt engine catalogs and local-only workflow
        run: python3 tools/art_pipeline/prompt_engine.py --self-test
      - name: Validate project structure and resource references
        run: python3 tools/validate_project.py

  godot-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Diagnose player script parser failure
        shell: sh
        run: |
          set +e
          godot --headless --path game --check-only --script res://scripts/player.gd 2>&1 | tee /tmp/player-parse.log
          status=${PIPESTATUS:-}
          grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" /tmp/player-parse.log || true
          exit 0
      - name: Import and parse project
        shell: sh
        run: |
          godot --headless --editor --path game --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            echo "Godot script parse/import errors detected"
            exit 1
          fi
      - name: Verify imported core hero animation playback
        shell: sh
        run: |
          timeout 120s godot --headless --path game --script res://tools/verify_character_animation_runtime.gd 2>&1 | tee /tmp/character-animation-runtime.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" /tmp/character-animation-runtime.log; then
            echo "Character animation runtime validation reported engine errors"
            exit 1
          fi
          grep -q "CHARACTER_ANIMATION_RUNTIME_PASS heroes=5" /tmp/character-animation-runtime.log
      - name: Build and mount a real chapter PCK
        shell: sh
        run: |
          set -eu
          probe="game/assets/environments/galaxy_wars/ci_pck_probe.json"
          output="/tmp/galaxy_wars_ci_probe.pck"
          mkdir -p "$(dirname "$probe")"
          trap 'rm -f "$probe" "$output"' EXIT
          printf '%s' '{"probe":"chapter pck builder verified"}' > "$probe"

          echo "PCK_DIAG invalid-chapter test: start"
          set +e
          timeout 120s godot --headless --path game --script res://tools/build_chapter_pck.gd -- --chapter invalid --output /tmp/invalid.pck > /tmp/pck-invalid.log 2>&1
          invalid_status=$?
          set -e
          cat /tmp/pck-invalid.log
          echo "PCK_DIAG invalid-chapter test: exit=$invalid_status"
          if [ "$invalid_status" -eq 124 ]; then
            echo "PCK builder timed out during invalid-chapter argument validation"
            exit 1
          fi
          if [ "$invalid_status" -eq 0 ]; then
            echo "PCK builder unexpectedly accepted an invalid chapter ID"
            exit 1
          fi
          grep -q "Missing or unsupported --chapter" /tmp/pck-invalid.log

          echo "PCK_DIAG chapter build: start"
          timeout 120s godot --headless --path game --script res://tools/build_chapter_pck.gd -- --chapter galaxy_wars --output "$output"
          echo "PCK_DIAG chapter build: completed"
          test -s "$output"
          echo "PCK_DIAG mount verification: start"
          timeout 120s godot --headless --path game --script res://tools/verify_chapter_pck.gd -- --pck "$output"
          echo "PCK_DIAG mount verification: completed"
      - name: Launch main scene headlessly
        shell: sh
        run: |
          godot --headless --path game --quit-after 3 2>&1 | tee /tmp/godot-run.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-run.log; then
            echo "Godot runtime script errors detected"
            exit 1
          fi
      - name: Run core framework smoke tests
        shell: sh
        run: |
          timeout 60s godot --headless --path game res://tests/framework_smoke_test.tscn 2>&1 | tee /tmp/framework-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|Assertion failed" /tmp/framework-test.log; then
            echo "Framework smoke tests failed"
            exit 1
          fi
          grep -q "FRAMEWORK_SMOKE_TEST_PASS" /tmp/framework-test.log
