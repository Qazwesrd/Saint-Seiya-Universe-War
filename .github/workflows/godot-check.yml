name: Godot Android Prototype Checks

on:
  push:
    paths:
      - "game/**"
      - "tools/**"
      - ".github/workflows/godot-check.yml"
  pull_request:
    paths:
      - "game/**"
      - "tools/**"
      - ".github/workflows/godot-check.yml"
  workflow_dispatch:

concurrency:
  group: godot-android-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  project-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate art delivery manifests
        run: python3 tools/art_pipeline/build_manifests.py
      - name: Validate authored art assets
        run: python3 tools/art_pipeline/validate_authored_assets.py
      - name: Validate project structure and resource references
        run: python3 tools/validate_project.py

  godot-headless:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import and parse project
        shell: sh
        run: |
          godot --headless --editor --path game --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-import.log; then
            echo "Godot script parse/import errors detected"
            exit 1
          fi
      - name: Launch main scene headlessly
        shell: sh
        run: |
          godot --headless --path game --quit-after 3 2>&1 | tee /tmp/godot-run.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script" /tmp/godot-run.log; then
            echo "Godot runtime script errors detected"
            exit 1
          fi
      - name: Run core framework smoke tests
        shell: sh
        run: |
          timeout 60s godot --headless --path game res://tests/framework_smoke_test.tscn 2>&1 | tee /tmp/framework-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR: Failed to load script|Assertion failed" /tmp/framework-test.log; then
            echo "Framework smoke tests failed"
            exit 1
          fi
          grep -q "FRAMEWORK_SMOKE_TEST_PASS" /tmp/framework-test.log
