name: Android APK Export

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Blender Art Prototype Export"]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - .github/workflows/android-export.yml
      - game/export_presets.cfg
      - game/project.godot
      - game/**

concurrency:
  group: android-apk-export-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  android-export:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Resolve latest successful Blender asset bundle
        id: blender_bundle
        uses: actions/github-script@v7
        with:
          script: |
            let run;
            if (context.eventName === "workflow_run") {
              const completed = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.payload.workflow_run.id
              });
              if (completed.data.conclusion !== "success") {
                throw new Error("The Blender asset export workflow did not succeed.");
              }
              run = completed.data;
            } else {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: "blender-art-pipeline.yml", per_page: 50
              });
              run = runs.data.workflow_runs.find(item =>
                item.conclusion === "success" && item.head_sha === context.sha
              );
              if (!run) {
                throw new Error("No successful Blender asset bundle exists for this exact source commit; refusing to reuse stale assets.");
              }
            }
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner, repo: context.repo.repo, run_id: run.id
            });
            const artifact = artifacts.data.artifacts.find(item =>
              item.name.startsWith("blender-art-prototypes-") && !item.expired
            );
            if (!artifact) throw new Error("Latest successful Blender run has no unexpired art bundle.");
            core.setOutput("run_id", String(run.id));
            core.setOutput("artifact_name", artifact.name);
            core.info(`Using Blender run ${run.id}: ${artifact.name}`);
      - name: Download generated character, armor, environment and enemy models
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.blender_bundle.outputs.artifact_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.blender_bundle.outputs.run_id }}
          path: game
      - name: Verify complete generated model bundle
        run: |
          set -eu
          environment_count="$(find game/assets/environments -name environment.glb -type f | wc -l | tr -d " " )"
          character_count="$(find game/assets/characters -path "*/model/character.glb" -type f | wc -l | tr -d " " )"
          animation_count="$(find game/assets/characters -path "*/animations/animation_library.glb" -type f | wc -l | tr -d " " )"
          armor_count="$(find game/assets/armors -path "*/model/armor.glb" -type f | wc -l | tr -d " " )"
          enemy_count="$(find game/assets/enemies -path "*/model/enemy.glb" -type f | wc -l | tr -d " " )"
          echo "Generated bundle: environments=$environment_count/7 characters=$character_count/32 animation_libraries=$animation_count/32 armors=$armor_count/82 enemies=$enemy_count/57"
          test "$environment_count" -eq 7
          test "$character_count" -eq 32
          test "$animation_count" -eq 32
          test "$armor_count" -eq 82
          test "$enemy_count" -eq 57

      - name: Import and validate project
        env:
          HOME: /root
        run: godot --headless --editor --path game --quit

      - name: Install Android API 34 build tools
        env:
          HOME: /root
          ANDROID_HOME: /usr/lib/android-sdk
        run: |
          yes | sdkmanager --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Configure Godot Android signing and tool paths
        env:
          HOME: /root
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cat >> /root/.config/godot/editor_settings-4.4.tres <<'EOF'
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          godot --headless --editor --path game --quit
          # Inject ephemeral CI-only debug signing values into the ignored build workspace.
          # Godot validates export presets before the command-line environment overrides run.
          sed -i "s#keystore/debug=\"\"#keystore/debug=\"$GODOT_ANDROID_KEYSTORE_DEBUG_PATH\"#" game/export_presets.cfg
          sed -i "s#keystore/debug_user=\"\"#keystore/debug_user=\"$GODOT_ANDROID_KEYSTORE_DEBUG_USER\"#" game/export_presets.cfg
          sed -i "s#keystore/debug_password=\"\"#keystore/debug_password=\"$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD\"#" game/export_presets.cfg
          grep -q 'keystore/debug="/root/debug.keystore"' game/export_presets.cfg
          keytool -list -keystore /root/debug.keystore -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER"
          test -x /usr/lib/android-sdk/platform-tools/adb
          test -x /usr/lib/android-sdk/build-tools/34.0.0/apksigner
      - name: Diagnose Android export environment
        env:
          HOME: /root
        run: |
          echo "HOME=$HOME"
          ls -la /root/.config/godot/
          cat /root/.config/godot/editor_settings-4.4.tres
          ls -la /root/.local/share/godot/export_templates/4.4.1.stable/
          ls -la /root/debug.keystore /usr/lib/android-sdk /usr/lib/jvm/java-17-openjdk-amd64/bin/java
          find /usr/lib/android-sdk/ndk /usr/lib/android-sdk/cmake -maxdepth 2 -type d

      - name: Export Android ARM64 debug APK
        env:
          HOME: /root
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_HOME: /usr/lib/android-sdk
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          test -s /root/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk
          test -s /root/debug.keystore
          test -x "$JAVA_HOME/bin/java"
          # Verify the CI-only debug signing values before invoking Godot.
          grep -q 'keystore/debug="/root/debug.keystore"' game/export_presets.cfg
          grep -q 'keystore/debug_user="androiddebugkey"' game/export_presets.cfg
          mkdir -p build/android
          godot --headless --verbose --path game --export-debug "Android" ../build/android/Saint-Seiya-Universe-War-debug.apk
          test -s build/android/Saint-Seiya-Universe-War-debug.apk

      - name: Verify exported Godot resources are embedded in the APK
        run: |
          set -eu
          apk="build/android/Saint-Seiya-Universe-War-debug.apk"
          test -s "$apk"
          command -v jar
          jar tf "$apk" > /tmp/apk-entries.txt

          # Godot Android exports project resources directly under APK assets/.
          # A standalone .pck file is not required for this platform.
          grep -Fx "assets/scenes/main.tscn" /tmp/apk-entries.txt
          grep -Fx "assets/assets/armors/aries_gold_cloth/manifest.json" /tmp/apk-entries.txt
          grep -E '^assets/\.godot/imported/.*\.scn$' /tmp/apk-entries.txt > /tmp/imported-resource-entries.txt
          imported_count="$(wc -l < /tmp/imported-resource-entries.txt | tr -d ' ')"
          if [ "$imported_count" -lt 1 ]; then
            echo "No imported Godot scene resources were found in the APK."
            grep -F "assets/" /tmp/apk-entries.txt | head -n 120 || true
            exit 1
          fi

          asset_count="$(grep -E '^assets/' /tmp/apk-entries.txt | wc -l | tr -d ' ')"
          echo "APK_BYTES=$(wc -c < "$apk" | tr -d ' ')"
          echo "EMBEDDED_ASSET_COUNT=$asset_count"
          echo "IMPORTED_GODOT_RESOURCE_COUNT=$imported_count"
          echo "APK_MAIN_SCENE=assets/scenes/main.tscn"
          echo "APK_CONTENT_MANIFEST=assets/assets/armors/aries_gold_cloth/manifest.json"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saint-Seiya-Universe-War-Android-ARM64-debug
          path: build/android/Saint-Seiya-Universe-War-debug.apk
          if-no-files-found: error
          retention-days: 14
