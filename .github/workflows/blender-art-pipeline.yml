name: Blender Art Prototype Export
# Rebuild assets after the Android packaging workflow fix.
# Keep the repaired APK verifier and generated bundle on the same commit.
# Re-run the asset export so the repaired Android workflow receives a matching bundle.
# Refresh the exact-commit bundle after correcting appended-PCK verification.
# Rebuild matching asset bundle for the APK ZIP-member PCK verifier.

on:
  push:
    paths:
      - "tools/art_pipeline/blender/**"
      - "tools/art_pipeline/batch_asset_factory.py"
      - "tools/art_pipeline/build_manifests.py"
      - "tools/art_pipeline/validate_authored_assets.py"
      - "game/scripts/equipment_database.gd"
      - "game/scripts/skill_system.gd"
      - "game/scripts/enemy_database.gd"
      - "game/scripts/character_visual_catalog.gd"
      - "game/scripts/skill_animation_catalog.gd"
      - "game/scripts/equipment_database.gd"
      - ".github/workflows/blender-art-pipeline.yml"
  pull_request:
    paths:
      - "tools/art_pipeline/blender/**"
      - "tools/art_pipeline/batch_asset_factory.py"
      - "tools/art_pipeline/build_manifests.py"
      - "tools/art_pipeline/validate_authored_assets.py"
      - "game/scripts/equipment_database.gd"
      - "game/scripts/skill_system.gd"
      - ".github/workflows/blender-art-pipeline.yml"
  workflow_dispatch:

concurrency:
  group: blender-art-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export-prototype-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get install --no-install-recommends -y blender python3-numpy libegl1 libgl1 libgles2 libgl1-mesa-dri libgbm1
          blender --version
      - name: Generate and structurally validate GLB prototypes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/art_pipeline/build_manifests.py
          export LIBGL_ALWAYS_SOFTWARE=1
          export EGL_PLATFORM=surfaceless
          export BLENDER_BIN=blender
          export ART_FACTORY_WORKERS=2
          export ART_FACTORY_SHARDS=2
          python3 tools/art_pipeline/batch_asset_factory.py 2>&1 | tee blender-export.log
          grep -q "ART_FACTORY_BATCHES_PASS" blender-export.log
          python3 - <<'PY'
          from pathlib import Path
          import struct

          previews = list(Path("game/art_previews/characters").glob("*_front.png"))
          if len(previews) != 1:
              raise SystemExit(f"Expected exactly one representative character preview, found {len(previews)}")
          preview = previews[0]
          data = preview.read_bytes()
          if len(data) < 128 or data[:8] != bytes((137, 80, 78, 71, 13, 10, 26, 10)):
              raise SystemExit(f"Character preview is not a valid PNG: {preview}")
          width, height = struct.unpack(">II", data[16:24])
          if width != 960 or height != 960:
              raise SystemExit(f"Unexpected preview dimensions: {width}x{height}")
          print(f"CHARACTER_PREVIEW_VALIDATED {preview} {width}x{height} bytes={len(data)}")
          armor_previews = list(Path("game/art_previews/armors").glob("*_front.png"))
          if len(armor_previews) != 1:
              raise SystemExit(f"Expected exactly one representative armor preview, found {len(armor_previews)}")
          armor_data = armor_previews[0].read_bytes()
          if len(armor_data) < 128 or armor_data[:8] != bytes((137, 80, 78, 71, 13, 10, 26, 10)):
              raise SystemExit(f"Armor preview is not a valid PNG: {armor_previews[0]}")
          armor_width, armor_height = struct.unpack(">II", armor_data[16:24])
          if (armor_width, armor_height) != (960, 960):
              raise SystemExit(f"Unexpected armor preview dimensions: {armor_width}x{armor_height}")
          print(f"ARMOR_PREVIEW_VALIDATED {armor_previews[0]} {armor_width}x{armor_height} bytes={len(armor_data)}")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import struct

          preview = Path("game/art_previews/bosses/pope_saga_front.png")
          if not preview.is_file():
              raise SystemExit(f"Dedicated Pope Saga boss preview is missing: {preview}")
          data = preview.read_bytes()
          if len(data) < 128 or data[:8] != bytes((137, 80, 78, 71, 13, 10, 26, 10)):
              raise SystemExit(f"Boss preview is not a valid PNG: {preview}")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (960, 960):
              raise SystemExit(f"Unexpected boss preview dimensions: {width}x{height}")
          print(f"BOSS_PREVIEW_VALIDATED {preview} {width}x{height} bytes={len(data)}")
          PY
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools/art_pipeline")
          from build_manifests import catalog_ids

          pack_catalog = json.loads(Path("game/content/pack_catalog.json").read_text(encoding="utf-8"))
          chapter_ids = [key for key, value in pack_catalog["packs"].items()
                         if key != "core" and value.get("auto_download", False)]
          checks = [
              ("characters", Path("game/scripts/character_visual_catalog.gd"), "const PROFILES := {",
               Path("game/assets/characters"), "model/character.glb", 32),
              ("armors", Path("game/scripts/equipment_database.gd"), "const EQUIPMENT := {",
               Path("game/assets/armors"), "model/armor.glb", 82),
              ("enemies", Path("game/scripts/enemy_database.gd"), "const ARCHETYPES := {",
               Path("game/assets/enemies"), "model/enemy.glb", 57),
          ]
          errors = []
          environment_root = Path("game/assets/environments")
          missing_chapters = [chapter_id for chapter_id in chapter_ids
                              if not (environment_root / chapter_id / "environment.glb").is_file()]
          environment_count = len(list(environment_root.glob("*/environment.glb")))
          print(f"ART_BUNDLE_CHECK environments: catalog={len(chapter_ids)} expected=7 files={environment_count} missing={len(missing_chapters)}")
          if len(chapter_ids) != 7 or environment_count != 7 or missing_chapters:
              errors.append(f"environments: missing or extra chapter models; missing IDs={missing_chapters}")
          for label, catalog_path, marker, root, relative_model, expected_count in checks:
              ids = catalog_ids(catalog_path, marker)
              missing = [asset_id for asset_id in ids if not (root / asset_id / relative_model).is_file()]
              actual = len(list(root.glob("*/" + relative_model)))
              print(f"ART_BUNDLE_CHECK {label}: catalog={len(ids)} expected={expected_count} files={actual} missing={len(missing)}")
              if len(ids) != expected_count:
                  errors.append(f"{label}: catalog has {len(ids)}, expected {expected_count}")
              if actual != expected_count or missing:
                  errors.append(f"{label}: missing or extra model files; missing IDs={missing}")
          exported_enemy_lines = sum("ENEMY_MODEL_EXPORTED " in line for line in Path("blender-export.log").read_text(encoding="utf-8", errors="replace").splitlines())
          print(f"ART_BUNDLE_CHECK enemy_export_log_lines={exported_enemy_lines}")
          if exported_enemy_lines != 57:
              errors.append(f"enemy export log has {exported_enemy_lines} entries, expected 57")
          for path in (
              "game/assets/_source_templates/humanoid_base/humanoid_base.glb",
              "game/assets/_source_templates/humanoid_animation_library/animation_library.glb",
              "game/assets/_source_templates/modular_armor_kit/modular_armor_kit.glb",
          ):
              if not Path(path).is_file() or Path(path).stat().st_size <= 32:
                  errors.append(f"missing or invalid shared prototype: {path}")
          if errors:
              raise SystemExit("\\n".join(errors))
          PY
      - name: Validate all 32 profession models and 52 animation clips
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/art_pipeline")
          from build_manifests import catalog_ids
          from validate_authored_assets import check_glb

          root = Path("game/assets/characters")
          class_ids = catalog_ids(Path("game/scripts/character_visual_catalog.gd"), "const PROFILES := {")
          required_clips = (
              "idle", "walk", "run", "jump", "fall", "land",
              "basic_attack_1", "basic_attack_2", "basic_attack_3", "signature_idle",
              "skill_cast", "hit_light", "hit_heavy", "dodge", "block",
              "victory", "defeat", "phase_shift",
          )
          if len(class_ids) != 32 or len(set(class_ids)) != 32:
              raise SystemExit(f"Expected 32 unique professions, found {len(class_ids)}")

          import re
          skill_source = Path("game/scripts/skill_system.gd").read_text(encoding="utf-8")
          all_ability_ids = re.findall(r'"id"\s*:\s*"([^"]+)"', skill_source)
          if len(all_ability_ids) != 768 or len(set(all_ability_ids)) != 768:
              raise SystemExit(f"Expected 768 unique ability IDs, found {len(all_ability_ids)}")

          audited_ability_total = 0
          for class_id in class_ids:
              model = root / class_id / "model/character.glb"
              animation_library = root / class_id / "animations/animation_library.glb"
              if not model.is_file() or not animation_library.is_file():
                  raise SystemExit(f"{class_id}: profession model or animation library is missing")
              combo_clips = [f"{class_id}_basic_attack_{step}" for step in (1, 2, 3)]
              skill_categories = ("melee", "projectile", "defense", "heal", "area", "mobility", "ultimate")
              skill_clips = [f"{class_id}_skill_{category}" for category in skill_categories]
              ability_clips = list(dict.fromkeys(
                  ability_id for ability_id in all_ability_ids if ability_id.startswith(class_id + "_")
              ))
              if len(ability_clips) != 24:
                  raise SystemExit(f"{class_id}: expected 24 skill-specific clips, found {len(ability_clips)}")
              audited_ability_total += len(ability_clips)
              expected_clips = list(required_clips) + combo_clips + skill_clips + ability_clips
              check_glb(model, require_skin=True, clips=expected_clips)
              animation_data = check_glb(animation_library, clips=expected_clips, require_meshes=False)
              animation_by_name = {item.get("name"): item for item in animation_data["animations"]}
              # Combo attacks use a full-body chain (at least 8 animated bones).
              # Skill archetypes and individual abilities are intentionally more focused:
              # their valid authored poses animate 5-9 bones depending on the skill type.
              for clip_name in combo_clips:
                  clip = animation_by_name[clip_name]
                  if len(clip.get("channels", [])) < 8:
                      raise SystemExit(f"{class_id}: {clip_name} has too few full-body combo tracks")
              signature_pose = animation_by_name[f"{class_id}_signature_idle"]
              if len(signature_pose.get("channels", [])) < 10:
                  raise SystemExit(f"{class_id}: signature idle does not articulate a full-body stance")
              for clip_name in skill_clips + ability_clips:
                  clip = animation_by_name[clip_name]
                  if len(clip.get("channels", [])) < 5:
                      raise SystemExit(f"{class_id}: {clip_name} has too few focused skill tracks")
              print(f"PROFESSION_ANIMATION_VALIDATED {class_id} clips={len(expected_clips)} unique_skill_clips={len(ability_clips)}")

          if audited_ability_total != 768:
              raise SystemExit(f"Expected 768 audited skill clips, found {audited_ability_total}")
          print(f"PROFESSION_ANIMATION_AUDIT_PASS professions={len(class_ids)} unique_skill_clips={audited_ability_total} clips_per_asset={len(required_clips) + 3 + len(skill_categories) + 24}")
          PY
      - name: Upload generated GLB prototypes
        uses: actions/upload-artifact@v4
        with:
          name: blender-art-prototypes-${{ github.sha }}
          path: |
            game/assets/_source_templates/humanoid_base/humanoid_base.glb
            game/assets/_source_templates/humanoid_animation_library/animation_library.glb
            game/assets/_source_templates/modular_armor_kit/modular_armor_kit.glb
            game/assets/environments/*/environment.glb
            game/assets/characters/*/model/character.glb
            game/assets/characters/*/animations/animation_library.glb
            game/assets/armors/*/model/armor.glb
            game/assets/enemies/*/model/enemy.glb
            game/assets/enemies/*/manifest.json
            game/art_previews/characters/*.png
            game/art_previews/armors/*.png
            game/art_previews/bosses/pope_saga_front.png
            game/assets/characters/*/manifest.json
            game/assets/armors/*/manifest.json
          if-no-files-found: error
          retention-days: 14
